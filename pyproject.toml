[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-starter"
version = "0.1.0"
description = "Zero-dependency Python CLI starter template"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cli-starter = "cli_starter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
